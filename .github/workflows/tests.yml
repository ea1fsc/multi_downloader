name: Tests

on:
  # Branch pushes only: tag pushes run these tests through release.yml.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # uv installs the Python version from .python-version and the
      # dependency versions locked in uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # PySide6 links these system libraries even for the offscreen GUI tests.
      - name: Install Linux libraries used by PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen pytest
