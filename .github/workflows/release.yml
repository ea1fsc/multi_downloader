name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Require vX, vX.Y, or vX.Y.Z
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Tag '${TAG}' does not match vX, vX.Y, or vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: multi-downloader-linux-amd64
          - os: windows-latest
            artifact_name: multi-downloader-windows-amd64.exe
          - os: macos-latest
            artifact_name: multi-downloader-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux libraries used by PySide6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller

      - name: Build binary
        run: python packaging/build.py

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp dist/multi-downloader "artifacts/${{ matrix.artifact_name }}"
          chmod +x "artifacts/${{ matrix.artifact_name }}"

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item dist/multi-downloader.exe "artifacts/${{ matrix.artifact_name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          if-no-files-found: error

  linux-packages:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dpkg-deb
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev xz-utils

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: multi-downloader-linux-amd64
          path: artifacts

      - name: Build Debian and Arch packages
        run: |
          chmod +x artifacts/multi-downloader-linux-amd64
          python packaging/make_linux_packages.py \
            --binary artifacts/multi-downloader-linux-amd64 \
            --version "${{ needs.validate-tag.outputs.version }}" \
            --output-dir packages

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/*
          if-no-files-found: error

  release:
    needs: [validate-tag, build, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f -exec cp {} upload/ \;
          ls -la upload

      - name: Build release notes from CHANGELOG
        run: python packaging/extract_changelog.py "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" upload/* \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
