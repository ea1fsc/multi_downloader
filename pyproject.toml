[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-downloader"
version = "0.1.0"
description = "CLI multi-platform media downloader for Instagram, Twitter/X and YouTube."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "instaloader",
  "pytubefix",
  "requests",
  "yt-dlp",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "PySide6>=6.6",
  "platformdirs>=4.0",
]
gui = [
  "PySide6>=6.6",
  "platformdirs>=4.0",
]

[project.scripts]
multi-downloader-gui = "desktop_main:main"

[tool.setuptools]
py-modules = ["multi_downloader", "desktop_main"]

[tool.setuptools.packages.find]
where = ["."]
