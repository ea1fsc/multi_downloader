[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-downloader"
version = "0.4.0"
description = "Multi-platform media downloader for Instagram, Twitter/X and YouTube (CLI and desktop GUI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "instaloader",
  "pytubefix",
  "requests",
  "yt-dlp",
  "PySide6>=6.6",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
multi-downloader = "multi_downloader:main"

[tool.setuptools]
py-modules = ["multi_downloader"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ui*", "common*", "Instagram*", "Twitter*", "YouTube*"]
